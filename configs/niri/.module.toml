# display.kdl / input.kdl are hardware-specific; animations.kdl is generated by
# the Noctalia niri-animations plugin; animations/config.toml is tuned via
# nirimation; animations/showcase holds demo media that is not shipped in the
# repo. All are preserved across updates. nirimation is a script.
[packages]
label = "Niri"
repo = ["niri", "gtk3", "gtk-layer-shell", "python-gobject"]
preserve = ["cfg/display.kdl", "cfg/input.kdl", "animations.kdl", "animations/config.toml", "animations/showcase"]
chmod = ["animations/nirimation"]

# Waybar configuration. colors-noctalia.css is generated by the Noctalia
# template engine, so it is preserved across updates instead of being
# overwritten by the repo copy. colors-active.css is the stable mode entry
# (preset / Noctalia / per-wallpaper); it is rewritten at runtime, so preserve
# it too — otherwise an install would reset the user's chosen mode.
[packages]
label = "Waybar"
repo = ["waybar", "cava", "ddcutil", "libpulse"]
chmod = ["scripts/*.sh"]
preserve = ["colors-noctalia.css", "colors-active.css"]
